[package]
name = "jeangrey"
version = "1.1.121"
edition = "2021"
description = "Post-Quantum Secure Decentralized Messaging Protocol (LAN implementation)"
license = "MIT"

[[bin]]
name = "jeangrey"
path = "src/main.rs"

[dependencies]
libp2p = { version = "0.54", default-features = false, features = [
    "tcp",
    "tokio",
    "yamux",
    "plaintext",
    "kad",
    "macros",
    "autonat",
    "dcutr",
    "identify",
    "relay",
] }
ml-kem = "0.2"
ml-dsa = { version = "0.1", features = ["rand_core"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
rand_core = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "io-std"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"
anyhow = "1"
local-ip-address = "0.6"
zeroize = { version = "1", features = ["derive"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"